<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FRIENDS E-Commerce Cart System| My Cart</title>

  <style>
    /* ===== Global Reset ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background-color: #f5f7fa;
      color: #333;
    }

    /* ===== Header ===== */
    header {
      background: linear-gradient(135deg, #0072ff, #00c6ff);
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 50px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    header h1 {
      font-size: 26px;
      font-weight: 600;
    }

    header nav a {
      color: white;
      margin-left: 20px;
      text-decoration: none;
      font-weight: 500;
    }

    header nav a:hover {
      text-decoration: underline;
    }

    /* ===== Cart Section ===== */
    .cart-container {
      max-width: 1000px;
      margin: 50px auto;
      background: white;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      padding: 30px;
    }

    h2 {
      text-align: center;
      color: #0072ff;
      margin-bottom: 20px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      border-bottom: 1px solid #eee;
    }

    .cart-item img {
      width: 100px;
      height: 100px;
      border-radius: 10px;
      object-fit: cover;
      margin-right: 20px;
    }

    .item-details {
      flex: 1;
      display: flex;
      align-items: center;
    }

    .item-details h3 {
      font-size: 18px;
      color: #333;
    }

    .item-details p {
      font-size: 14px;
      color: #777;
    }

    .price {
      font-weight: bold;
      color: #0072ff;
      font-size: 18px;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .quantity button {
      width: 25px;
      height: 25px;
      background: #0072ff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    .quantity span {
      font-size: 16px;
    }

    .remove-btn {
      color: red;
      cursor: pointer;
      font-size: 14px;
      border: none;
      background: none;
      font-weight: 600;
    }

    /* ===== Cart Summary ===== */
    .summary {
      text-align: right;
      margin-top: 30px;
    }

    .summary h3 {
      font-size: 22px;
      margin-bottom: 10px;
      color: #333;
    }

    .checkout-btn {
      background: linear-gradient(135deg, #0072ff, #00c6ff);
      color: white;
      padding: 12px 25px;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .checkout-btn:hover {
      background: linear-gradient(135deg, #00c6ff, #0072ff);
    }

    /* ===== Footer ===== */
    footer {
      text-align: center;
      background: #0072ff;
      color: white;
      padding: 15px;
      margin-top: 50px;
      font-size: 14px;
    }

    /* ===== Responsive ===== */
    @media (max-width: 768px) {
      .cart-item {
        flex-direction: column;
        align-items: flex-start;
      }

      .item-details {
        flex-direction: column;
        align-items: flex-start;
      }

      .summary {
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>🛍️ FRIENDS E-Commerce Cart system💙</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="product.html">Products</a>
      <a href="cart.html">Cart</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <div class="cart-container">
    <h2>🛒 Your Shopping Cart</h2>
    <div id="cart-items"></div>

    <div class="summary">
      <h3>Total: ₹<span id="total">0</span></h3>
      <button class="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
    </div>
  </div>

  <footer>
    © 2025 FRIENDS E-Commerce Cart System | Designed with 💙
  </footer>

  <script>
    // ===== Sample Cart Data with Images =====
    let cart = [
      {
        id: 1,
        name: "Apple iPhone 15 Pro",
        price: 134999,
        quantity: 1,
        img: "https://store.storeimages.cdn-apple.com/4982/as-images.apple.com/is/iphone-15-pro-family-hero"
      },
      {
        id: 2,
        name: "Sony WH-1000XM5 Headphones",
        price: 29999,
        quantity: 2,
        img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSOux4xPx67B3OnDxjDlNlRkvE8msB70vjl7Q&s"
      },
      {
        id: 3,
        name: "Laptop Backpack",
        price: 10000,
        quantity: 1,
        img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT4DsKGNJTyV9Utyg6scH7sgZ16FNSNI09G_w&s"
      }
    ];

    const cartContainer = document.getElementById("cart-items");
    const totalDisplay = document.getElementById("total");

    // ===== Display Cart Items =====
    function displayCart() {
      cartContainer.innerHTML = "";
      let total = 0;

      cart.forEach((item, index) => {
        total += item.price * item.quantity;
        cartContainer.innerHTML += `
          <div class="cart-item">
            <div class="item-details">
              <img src="${item.img}" alt="${item.name}">
              <div>
                <h3>${item.name}</h3>
                <p>Price: ₹${item.price}</p>
              </div>
            </div>
            <div class="quantity">
              <button onclick="changeQty(${index}, -1)">-</button>
              <span>${item.quantity}</span>
              <button onclick="changeQty(${index}, 1)">+</button>
            </div>
            <div class="price">₹${item.price * item.quantity}</div>
            <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
          </div>
        `;
      });

      totalDisplay.textContent = total.toLocaleString();
    }

    // ===== Quantity Change =====
    function changeQty(index, amount) {
      cart[index].quantity += amount;
      if (cart[index].quantity <= 0) cart[index].quantity = 1;
      displayCart();
    }

    // ===== Remove Item =====
    function removeItem(index) {
      if (confirm("Remove this item from your cart?")) {
        cart.splice(index, 1);
        displayCart();
      }
    }

    // ===== Checkout Function =====
    function checkout() {
      alert("✅ Checkout Successful! Thank you for shopping with FRIENDS E-Commerce cart system.");
      cart = [];
      displayCart();
    }

    // ===== Initialize Cart Display =====
    displayCart();
  </script>
</body>
</html>
