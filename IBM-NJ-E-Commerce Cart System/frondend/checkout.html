<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout | suja E-Commerce</title>

  <style>
    /* ===== Global Styles ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #f3f7fa;
      color: #333;
    }

    header {
      background: linear-gradient(135deg, #0072ff, #00c6ff);
      color: white;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    header h1 {
      font-size: 24px;
    }

    header a {
      color: white;
      text-decoration: none;
      font-weight: 500;
    }

    /* ===== Checkout Container ===== */
    .checkout-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      padding: 40px 20px;
      max-width: 1200px;
      margin: auto;
    }

    /* ===== Left Form ===== */
    .checkout-form {
      flex: 1;
      min-width: 320px;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .checkout-form h2 {
      margin-bottom: 20px;
      color: #0072ff;
      font-size: 22px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: #555;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      transition: border 0.3s;
    }

    .form-group input:focus {
      border-color: #0072ff;
    }

    /* ===== Right Summary ===== */
    .order-summary {
      flex: 0.8;
      min-width: 320px;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .order-summary h2 {
      color: #0072ff;
      margin-bottom: 20px;
    }

    .order-item {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 1px solid #eee;
      padding-bottom: 10px;
    }

    .order-item img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 10px;
      margin-right: 15px;
    }

    .order-details h4 {
      margin-bottom: 5px;
    }

    .order-details p {
      color: #777;
      font-size: 14px;
    }

    .price {
      font-weight: 600;
      color: #0072ff;
      margin-left: auto;
    }

    .total {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
      color: #333;
    }

    /* ===== Checkout Button ===== */
    .checkout-btn {
      margin-top: 25px;
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #0072ff, #00c6ff);
      border: none;
      color: white;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.3s ease, background 0.3s ease;
    }

    .checkout-btn:hover {
      transform: scale(1.05);
      background: linear-gradient(135deg, #00c6ff, #0072ff);
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #0072ff;
      color: white;
      margin-top: 40px;
    }

    @media (max-width: 768px) {
      .checkout-container {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>suja Checkout 🛍️</h1>
    <a href="cart.html">← Back to Cart</a>
  </header>

  <section class="checkout-container">
    
    <!-- ===== Left Form Section ===== -->
    <div class="checkout-form">
      <h2>Shipping Information</h2>
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" placeholder="Enter your name" required>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" placeholder="you@example.com" required>
      </div>

      <div class="form-group">
        <label>Address</label>
        <input type="text" placeholder="Street, City, ZIP code" required>
      </div>

      <div class="form-group">
        <label>Payment Method</label>
        <select required>
          <option>Credit/Debit Card</option>
          <option>UPI / Netbanking</option>
          <option>Cash on Delivery</option>
        </select>
      </div>

      <div class="form-group">
        <label>Phone</label>
        <input type="text" placeholder="+91 9944877933" required>
      </div>

      <button class="checkout-btn" onclick="placeOrder()">✅ Confirm & Pay</button>
    </div>

    <!-- ===== Right Summary Section ===== -->
    <div class="order-summary">
      <h2>Order Summary</h2>

      <div class="order-item">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSOux4xPx67B3OnDxjDlNlRkvE8msB70vjl7Q&s" alt="Headphones">
        <div class="order-details">
          <h4>Wireless Headphones</h4>
          <p>Noise Cancelling</p>
        </div>
        <div class="price">₹29,999</div>
      </div>

      <div class="order-item">
        <img src="https://m.media-amazon.com/images/I/51yI829dMoL._UF1000,1000_QL80_.jpg" alt="Smartwatch">
        <div class="order-details">
          <h4>Smart Watch</h4>
          <p>Fitness Tracker</p>
        </div>
        <div class="price">₹24,999</div>
      </div>

      <div class="order-item">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT4DsKGNJTyV9Utyg6scH7sgZ16FNSNI09G_w&s" alt="Backpack">
        <div class="order-details">
          <h4>Laptop Backpack</h4>
          <p>Waterproof</p>
        </div>
        <div class="price">₹10,000</div>
      </div>

      <div class="total">
        <span>Total</span>
        <span>₹64,998</span>
      </div>
    </div>

  </section>

  <footer>
    © 2025 suja E-Commerce Cart System | Checkout Page
  </footer>

  <script>
    function placeOrder() {
      alert("✅ Order placed successfully! Thank you for shopping with suja E-Commerce cart system💙");
    }
  </script>

</body>
</html>
